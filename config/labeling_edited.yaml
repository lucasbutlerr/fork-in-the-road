# labeling.yaml -- defines what counts as a successful vs. failed breakout
# for a candidate flagged by the scanner on a given date.
#
# evaluation_method:
#   first_touch    -- whichever of target_return / stop_loss_return is hit
#                      first within the horizon wins. Models an actual
#                      trade with a profit target and a stop loss -- the
#                      more realistic of the two methods.
#   end_of_horizon -- ignores intra-horizon touches entirely; looks only
#                      at the return on the horizon's last day vs.
#                      target_return. Simpler, but can call a breakout
#                      "successful" even if it dipped well past what would
#                      have been a real stop loss along the way, since it
#                      only ever checks the endpoint.
#
# Note on first_touch and same-day ambiguity: daily OHLC can't tell you
# whether the high or the low came first within a single trading day. If
# both the target and the stop are touched on the same day, OutcomeLabeler
# conservatively assumes the stop was hit first (labels it a FAILURE)
# rather than risk overstating the success rate -- see labeler.py.

horizon_trading_days: 10
target_return: 0.08
stop_loss_return: -0.08
evaluation_method: first_touch
