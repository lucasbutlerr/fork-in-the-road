name: CI

# Runs the test suite on every push and pull request. Nothing here touches
# the network for real data -- all yfinance calls are monkeypatched in
# tests/, so this is fast, deterministic, and safe to run on every commit.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q
