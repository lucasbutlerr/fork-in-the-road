[project]
name = "fork-in-the-road"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "pyarrow>=16.0",
    "xgboost>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "scikit-learn>=1.3",
    "joblib>=1.3",
	"optuna>=4.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
